name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: JUnit 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        run: ./mvnw -B test
