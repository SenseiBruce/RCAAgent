name: Validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check
        run: ./mvnw -B fmt:check
      - name: Detected wrongly formatted files
        if: failure()
        run: |
          echo "Java sources are not formatted with Google Java Format."
          echo "Run ./mvnw fmt:format and commit the result."
          exit 1
      - name: Lint
        run: ./mvnw -B checkstyle:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        run: make test

  test-offline:
    name: Test (offline, no API keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests with provider credentials unset
        run: env -u OPENAI_API_KEY -u OPENROUTER_API_KEY -u AWS_REGION -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u GITHUB_TOKEN make test

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test with coverage gate
        run: ./mvnw -B clean verify
      - name: Verify Maven dependency lock
        run: bash scripts/check-dependency-tree.sh
      - name: Verify lock check fails on drift
        run: bash scripts/test-dependency-lock-drift.sh
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error

  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit lockfile
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run build
      - name: Test
        run: npm test

  dependency-audit:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v6
        with:
          path: .owasp-nvd
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: owasp-nvd-
      - name: OWASP dependency-check
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DdataDirectory=${{ github.workspace }}/.owasp-nvd
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: |
          mv backend.tf backend.tf.remote
          terraform init -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_EC2_METADATA_DISABLED: "true"
        run: terraform plan -input=false -lock=false -refresh=false -out=tfplan
      - name: Restore remote backend config
        if: always()
        run: |
          if [ -f backend.tf.remote ]; then mv backend.tf.remote backend.tf; fi
      - name: Upload terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: deploy/terraform/tfplan
          if-no-files-found: error
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy/terraform
          framework: terraform
          compact: true
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_260,CKV2_AWS_11,CKV_AWS_107,CKV2_AWS_5,CKV_AWS_23,CKV_AWS_24,CKV_AWS_25,CKV_AWS_103,CKV_AWS_2,CKV_AWS_91,CKV2_AWS_20,CKV_AWS_150,CKV_AWS_158,CKV_AWS_126,CKV_AWS_136,CKV_AWS_338,CKV2_AWS_29,CKV_AWS_383,CKV_TF_1
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: deploy/terraform
          additional_args: --config-file .tfsec.yml
          soft_fail: false
