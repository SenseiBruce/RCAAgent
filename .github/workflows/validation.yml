name: Validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check
        run: ./mvnw -B fmt:check
      - name: Detected wrongly formatted files
        if: failure()
        run: |
          echo "Java sources are not formatted with Google Java Format."
          echo "Run ./mvnw fmt:format and commit the result."
          exit 1
      - name: Lint
        run: ./mvnw -B checkstyle:check

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test with coverage gate
        run: ./mvnw -B clean verify
      - name: Verify Maven dependency lock
        run: bash scripts/check-dependency-tree.sh
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error

  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run build
      - name: Test
        run: npm test

  dependency-audit:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v6
        with:
          path: .owasp-nvd
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: owasp-nvd-
      - name: OWASP dependency-check
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DdataDirectory=${{ github.workspace }}/.owasp-nvd
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          compact: true
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_260,CKV2_AWS_11,CKV_AWS_107,CKV2_AWS_5,CKV_AWS_23,CKV_AWS_24,CKV_AWS_25,CKV_AWS_103,CKV_AWS_2,CKV_AWS_91,CKV2_AWS_20,CKV_AWS_150,CKV_AWS_158,CKV_AWS_126,CKV_AWS_136,CKV_AWS_338,CKV2_AWS_29,CKV_AWS_383
